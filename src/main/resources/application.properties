spring.application.name=backend-rifas

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Configuración de Conexión a Neon PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Flyway
spring.flyway.baseline-on-migrate=true

# JWT Configuration (Variables de entorno)
app.jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (Custom Properties)
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600