spring.application.name=backend-rifas

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Configuración de Conexión a Neon PostgreSQL (Sin comillas)
spring.datasource.url=jdbc:postgresql://${PGHOST:ep-green-mode-at2lu94f-pooler.c-9.us-east-1.aws.neon.tech}:${DB_PORT:5432}/${PGDATABASE:neondb}?sslmode=require
spring.datasource.username=${PGUSER:neondb_owner}
spring.datasource.password=${PGPASSWORD:npg_shNYqd5eJpw3}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Flyway
spring.flyway.baseline-on-migrate=true

# JWT Configuration (Variables de entorno)
app.jwt.secret=${JWT_SECRET:ClaveSecretaPorDefectoParaDesarrolloLocal123}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (Custom Properties)
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600